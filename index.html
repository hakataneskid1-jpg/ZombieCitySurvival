<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post-Apocalyptic Zombie Survival TPS</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0b0b0f;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
        }
        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            font-size: 20px;
            font-weight: bold;
        }
        .hud-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            pointer-events: none;
            transition: width 0.1s, height: 0.1s;
        }
        .crosshair.aiming {
            width: 6px;
            height: 6px;
            border-color: #ff3333;
        }
        #crosshair-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2px;
            height: 2px;
            background: #fff;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #instructions {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 15, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            cursor: pointer;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }
        #instructions h1 {
            color: #e53935;
            font-size: 42px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        #instructions p {
            color: #ccc;
            font-size: 16px;
            line-height: 1.6;
            max-width: 600px;
        }
        .bar-container {
            width: 200px;
            height: 20px;
            background: rgba(50, 50, 50, 0.8);
            border: 2px solid #555;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 5px;
        }
        #health-fill {
            width: 100%;
            height: 100%;
            background: #e53935;
            transition: width 0.2s;
        }
        .weapon-box {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #444;
        }
        .weapon-item {
            color: #777;
            margin: 2px 0;
        }
        .weapon-item.active {
            color: #ffeb3b;
            font-weight: bold;
        }
        #damage-flash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 0, 0, 0);
            pointer-events: none;
            transition: background 0.1s;
            z-index: 5;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="damage-flash"></div>
    <div class="crosshair" id="crosshair"></div>
    <div id="crosshair-dot"></div>

    <div id="instructions">
        <h1>SURVIVE THE HORDE</h1>
        <p>
            <b>[クリックしてゲームスタート / マウスロック]</b><br><br>
            <b>[W A S D]</b> 移動 &nbsp;|&nbsp; <b>[Shift]</b> ダッシュ<br>
            <b>[マウス]</b> カメラ視点回転 &nbsp;|&nbsp; <b>[左クリック]</b> 射撃 (長押し連射)<br>
            <b>[右クリック長押し]</b> 肩越しエイム (ズーム)<br>
            <b>[1 / 2 / 3]</b> 武器切り替え（アサルトライフル / ショットガン / ピストル） &nbsp;|&nbsp; <b>[R]</b> リロード
        </p>
    </div>

    <div id="ui">
        <div class="hud-top
